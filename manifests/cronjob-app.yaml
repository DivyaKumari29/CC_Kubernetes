# Experiment 2: recurring task, one Job created every minute.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: report-cronjob
spec:
  schedule: "*/1 * * * *"          # cron syntax: every minute
  successfulJobsHistoryLimit: 3    # keep the last 3 successful Jobs
  failedJobsHistoryLimit: 1        # keep the last failed Job
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: report
            image: batch-app:1.0
            imagePullPolicy: IfNotPresent
          restartPolicy: OnFailure
